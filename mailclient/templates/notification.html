<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Alert</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #1c1e21;
        }
        .card {
            max-width: 550px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            border-left: 5px solid #3b82f6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            padding: 20px 24px;
            background: #fafafa;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
        }
        .badge {
            background-color: #dbeafe;
            color: #1e40af;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
        }
        .body {
            padding: 24px;
        }
        .title {
            font-size: 18px;
            font-weight: 700;
            margin: 10px 0;
            color: #111827;
        }
        .details-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        .details-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 14px;
        }
        .details-table tr td:first-child {
            font-weight: 600;
            color: #6b7280;
            width: 35%;
        }
        .footer {
            padding: 16px 24px;
            font-size: 12px;
            color: #9ca3af;
            background-color: #f9fafb;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <span class="badge">{{status}}</span>
        </div>
        <div class="body">
            <div class="title">{{title}}</div>
            <p>Hi {{name}},</p>
            <p>{{details}}</p>
            
            <table class="details-table">
                <tr>
                    <td>Event:</td>
                    <td>{{event_name}}</td>
                </tr>
                <tr>
                    <td>Time:</td>
                    <td>{{timestamp}}</td>
                </tr>
                <tr>
                    <td>Priority:</td>
                    <td>{{priority}}</td>
                </tr>
            </table>

            <p>If you did not initiate this activity, please check your system settings or contact support.</p>
        </div>
        <div class="footer">
            System Automated Notification • Do Not Reply
        </div>
    </div>
</body>
</html>
