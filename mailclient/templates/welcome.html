<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Email</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333333;
        }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
        }
        .content {
            padding: 30px 25px;
            line-height: 1.6;
        }
        .greeting {
            font-size: 20px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 15px;
        }
        .btn-container {
            text-align: center;
            margin: 30px 0;
        }
        .btn {
            background: #667eea;
            color: #ffffff !important;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.4);
        }
        .footer {
            background-color: #f8fafc;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #a0aec0;
            border-top: 1px solid #edf2f7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Welcome to {{company}}!</h1>
        </div>
        <div class="content">
            <div class="greeting">Hello {{name}},</div>
            <p>{{message}}</p>
            
            <div class="btn-container">
                <a href="{{action_url}}" class="btn">Get Started Now</a>
            </div>

            <p>If you have any questions, feel free to reply to this email.</p>
            <p>Best regards,<br><strong>{{sender_name}}</strong></p>
        </div>
        <div class="footer">
            &copy; {{year}} {{company}}. All rights reserved.
        </div>
    </div>
</body>
</html>
